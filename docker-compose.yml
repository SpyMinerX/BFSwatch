services:
  bfswatch:
    build: .
    container_name: bfswatch
    ports:
      - "5000:5000"
    environment:
      TZ: "Europe/Berlin"
      RUN_HOUR: "8"
      RUN_MINUTE: "5"

      FLASK_SECRET: "change-me"

      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "youraddress@gmail.com"
      SMTP_PASS: "your_app_password"
      MAIL_FROM: "youraddress@gmail.com"
      SMTP_STARTTLS: "1"

      BFSWATCH_DB: "/data/bfswatch.sqlite3"
    volumes:
      - ./data:/data
    restart: unless-stopped
